<!DOCTYPE html>
<html lang="en" xmlns:th="http://www.thymeleaf.org">

<head th:fragment="head(title)">
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1">
    <title th:text="${title} + ' · Employee Management System'">Employee Management System</title>
    <link rel="icon" type="image/svg+xml" th:href="@{/favicon.svg}" href="/favicon.svg">
    <link rel="stylesheet"
          href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.8/dist/css/bootstrap.min.css"
          integrity="sha384-sRIl4kxILFvY47J16cr9ZwB07vP4J8+LH7qKQnuqkuIAvNWLzeN8tE5YBujZqJLB"
          crossorigin="anonymous">
    <link rel="stylesheet"
          href="https://cdn.jsdelivr.net/npm/bootstrap-icons@1.13.2/font/bootstrap-icons.min.css"
          integrity="sha384-nWN3KqaaVcbEsCjLSV+2jMjh62Iny/+mN3srM8TZeM8N6aj7eDl5wwYggjAJ4/sJ"
          crossorigin="anonymous">
    <link rel="stylesheet" th:href="@{/css/app.css}" href="/css/app.css">
</head>

<body>

<th:block th:fragment="navigation(active)">
    <a class="skip-link" href="#main-content">Skip to main content</a>

    <header class="mobile-topbar d-lg-none">
        <button class="btn btn-icon" type="button" data-bs-toggle="offcanvas" data-bs-target="#sidebar"
                aria-controls="sidebar" aria-label="Open navigation menu">
            <i class="bi bi-list fs-4" aria-hidden="true"></i>
        </button>
        <a class="brand" th:href="@{/employees}">
            <span class="brand-mark" aria-hidden="true"><i class="bi bi-people-fill"></i></span>
            <span>EMS</span>
        </a>
    </header>

    <aside class="sidebar offcanvas-lg offcanvas-start" tabindex="-1" id="sidebar" aria-labelledby="sidebarTitle">
        <div class="offcanvas-header sidebar-header">
            <a class="brand" th:href="@{/employees}" id="sidebarTitle">
                <span class="brand-mark" aria-hidden="true"><i class="bi bi-people-fill"></i></span>
                <span class="brand-text">
                    <span class="brand-name">Employee</span>
                    <span class="brand-sub">Management System</span>
                </span>
            </a>
            <button type="button" class="btn-close d-lg-none" data-bs-dismiss="offcanvas" data-bs-target="#sidebar"
                    aria-label="Close navigation menu"></button>
        </div>
        <div class="offcanvas-body sidebar-body">
            <nav aria-label="Main navigation">
                <p class="sidebar-section">Workspace</p>
                <ul class="nav flex-column">
                    <li class="nav-item">
                        <a class="nav-link" th:href="@{/employees}"
                           th:classappend="${active == 'employees'} ? 'active'"
                           th:attr="aria-current=${active == 'employees'} ? 'page' : null">
                            <i class="bi bi-people" aria-hidden="true"></i> Employees
                        </a>
                    </li>
                    <li class="nav-item">
                        <a class="nav-link" th:href="@{/employees/new}"
                           th:classappend="${active == 'add'} ? 'active'"
                           th:attr="aria-current=${active == 'add'} ? 'page' : null">
                            <i class="bi bi-person-plus" aria-hidden="true"></i> Add Employee
                        </a>
                    </li>
                </ul>
                <p class="sidebar-section">Developer</p>
                <ul class="nav flex-column">
                    <li class="nav-item">
                        <a class="nav-link" th:href="@{/swagger-ui.html}" target="_blank" rel="noopener">
                            <i class="bi bi-braces" aria-hidden="true"></i> API Docs
                            <i class="bi bi-box-arrow-up-right small ms-auto" aria-hidden="true"></i>
                            <span class="visually-hidden">(opens in a new tab)</span>
                        </a>
                    </li>
                </ul>
            </nav>
        </div>
    </aside>
</th:block>

<div th:fragment="toasts" class="toast-container position-fixed top-0 end-0 p-3" aria-live="polite" aria-atomic="true">
    <div th:if="${successMessage}" class="toast align-items-center toast-success border-0" role="status"
         data-bs-delay="5000">
        <div class="d-flex">
            <div class="toast-body">
                <i class="bi bi-check-circle-fill me-2" aria-hidden="true"></i>
                <span th:text="${successMessage}">Saved.</span>
            </div>
            <button type="button" class="btn-close me-2 m-auto" data-bs-dismiss="toast" aria-label="Close"></button>
        </div>
    </div>
    <div th:if="${errorMessage}" class="toast align-items-center toast-error border-0" role="alert"
         data-bs-delay="8000">
        <div class="d-flex">
            <div class="toast-body">
                <i class="bi bi-exclamation-triangle-fill me-2" aria-hidden="true"></i>
                <span th:text="${errorMessage}">Something went wrong.</span>
            </div>
            <button type="button" class="btn-close me-2 m-auto" data-bs-dismiss="toast" aria-label="Close"></button>
        </div>
    </div>
</div>

<div th:fragment="deleteModal" class="modal fade" id="deleteModal" tabindex="-1" aria-labelledby="deleteModalTitle"
     aria-hidden="true">
    <div class="modal-dialog modal-dialog-centered">
        <form class="modal-content" method="post" id="deleteForm" action="#">
            <div class="modal-body p-4">
                <div class="d-flex gap-3">
                    <span class="modal-icon" aria-hidden="true"><i class="bi bi-trash3"></i></span>
                    <div>
                        <h2 class="h5 mb-2" id="deleteModalTitle">Delete employee?</h2>
                        <p class="text-secondary mb-0">
                            <strong class="text-body" id="deleteEmployeeName">This employee</strong>
                            will be deleted. This cannot be undone.
                        </p>
                    </div>
                </div>
            </div>
            <div class="modal-footer">
                <button type="button" class="btn btn-light" data-bs-dismiss="modal">Cancel</button>
                <button type="submit" class="btn btn-danger" data-loading-text="Deleting…">
                    Delete employee
                </button>
            </div>
        </form>
    </div>
</div>

<th:block th:fragment="scripts">
    <script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.8/dist/js/bootstrap.bundle.min.js"
            integrity="sha384-FKyoEForCGlyvwx9Hj09JcYn3nv7wiPVlz7YYwJrWVcXK/BmnVDxM+D2scQbITxI"
            crossorigin="anonymous"></script>
    <script th:src="@{/js/app.js}" src="/js/app.js"></script>
</th:block>

</body>
</html>
