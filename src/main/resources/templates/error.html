<!DOCTYPE html>
<html lang="en" xmlns:th="http://www.thymeleaf.org">
<head th:replace="~{fragments/layout :: head('Error')}"></head>
<body>
<div class="app-shell">
    <th:block th:replace="~{fragments/layout :: navigation('')}"></th:block>

    <main class="app-main" id="main-content" tabindex="-1">
        <section class="panel error-panel" th:with="code=${status} ?: 500">
            <span class="empty-icon" aria-hidden="true"><i class="bi bi-exclamation-octagon"></i></span>
            <p class="error-code" th:text="${code}">404</p>
            <h1 class="h3" th:text="${code == 404 and error == 'Not Found'} ? 'Page not found' : (${error} ?: 'Something went wrong')">
                Page not found
            </h1>
            <p class="text-secondary" th:if="${code == 404 and error == 'Not Found'}">
                The page you are looking for does not exist.
            </p>
            <p class="text-secondary" th:if="${code != 404 or error != 'Not Found'}"
               th:text="${message != null and !#strings.isEmpty(message) and code < 500} ? ${message} : 'An unexpected error occurred. Please try again.'">
                An unexpected error occurred.
            </p>
            <a class="btn btn-primary mt-2" th:href="@{/employees}">
                <i class="bi bi-arrow-left me-1" aria-hidden="true"></i> Back to Employees
            </a>
        </section>
    </main>
</div>
<th:block th:replace="~{fragments/layout :: scripts}"></th:block>
</body>
</html>
